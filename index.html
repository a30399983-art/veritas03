<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VERITAS — Asesoría profesional en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--sf:#141414;--sf2:#1d1d1d;--ln:#2e2a1e;--au:#f5b82e;--au2:#c98f0a;--tx:#fff;--mu:#b4b0a4;--ok:#22c55e;--no:#ef4444;color-scheme:dark;
--i-logo:url(img/logo.jpg);--i-medicina:url(img/medicina.jpg);--i-derecho:url(img/derecho.jpg);--i-ingenieria:url(img/ingenieria.jpg);--i-negocios:url(img/negocios.jpg);
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.55 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--au)}
:focus-visible{outline:2px solid var(--au);outline-offset:2px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font:700 26px var(--serif);letter-spacing:.04em}
.brand svg{width:30px;height:34px}
.search{flex:1;max-width:420px;margin:0 auto;position:relative}
.search input{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:10px 16px;outline:0}
.search input:focus{border-color:var(--au)}
nav{display:flex;align-items:center;gap:4px}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:500}
nav button:hover,nav button.on{color:var(--au)}
nav .reg{background:var(--au);color:#000;font-weight:700;border-radius:999px;padding:8px 18px;margin-left:6px}
nav .reg:hover{background:#ffc94d;color:#000}
.burger{display:none;background:none;border:1px solid var(--ln);border-radius:8px;width:42px;height:42px;cursor:pointer;font-size:20px}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--au);background:var(--au);color:#000;font-weight:700;border-radius:999px;padding:11px 22px;cursor:pointer;min-height:44px}
.btn:hover{background:#ffc94d}
.btn.gh{background:transparent;color:var(--au)}.btn.gh:hover{background:rgba(245,184,46,.12)}
.btn.rd{background:var(--no);border-color:var(--no);color:#fff}
.btn.gn{background:var(--ok);border-color:var(--ok);color:#000}
.btn[disabled]{opacity:.4;cursor:not-allowed}
/* inicio */
.hero{position:relative;text-align:center;padding:56px 0 40px;background:radial-gradient(ellipse at 50% 0,rgba(245,184,46,.16),transparent 60%)}
.logo{width:min(260px,60vw);aspect-ratio:480/380;margin:0 auto 8px;background:var(--i-logo) center/cover;border-radius:8px}
.hero h1{font-size:clamp(34px,6vw,60px);max-width:16ch;margin:0 auto 14px}
.hero p{color:var(--mu);max-width:56ch;margin:0 auto}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px 0 56px}
.cat{position:relative;min-height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:#000 center/cover;cursor:pointer;text-align:left;transition:border-color .2s,transform .2s}
.cat::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.92) 8%,rgba(0,0,0,.25) 65%)}
.cat:hover{border-color:var(--au);transform:translateY(-3px)}
.cat>*{position:relative}
.cat h2{font-size:32px;margin-bottom:4px}.cat p{margin:0 0 16px;color:var(--mu);font-size:14px}
.ico{width:40px;height:40px;stroke:var(--au);fill:none;stroke-width:1.6;margin-bottom:10px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:64px}
.trust div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:20px}
.trust h3{font-size:22px;color:var(--au);margin-bottom:6px}.trust p{margin:0;color:var(--mu);font-size:14px}
/* categoría */
.banner{position:relative;min-height:300px;display:flex;align-items:flex-end;background:#000 center/cover;border-bottom:1px solid var(--ln)}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.88) 25%,rgba(0,0,0,.2) 80%),linear-gradient(to top,#000,transparent 50%)}
.banner .wrap{position:relative;padding-bottom:28px}
.banner h1{font-size:clamp(34px,5.5vw,56px)}.banner p{color:var(--mu);margin:8px 0 0}
.crumb{background:none;border:0;color:var(--au);cursor:pointer;padding:0;margin-bottom:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:32px 0 64px}
.pro{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.pro.live{border-color:var(--au);box-shadow:0 0 0 1px var(--au),0 8px 30px rgba(245,184,46,.15)}
.ph{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 24px var(--serif);color:#000;background:linear-gradient(135deg,#ffd873,var(--au2))}
.pro h3{font-size:22px}.pro small{color:var(--mu);display:block}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.st i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.st.ec i{background:var(--no)}.st.ev{color:var(--au)}.st.ev i{background:var(--au);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.vb{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--au);font-weight:700}
.vb svg{width:16px;height:16px}
.acts{display:grid;gap:8px;margin-top:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 0}
/* en vivo */
.live-l{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:24px 0 56px;align-items:start}
.screen{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000 center/cover;border:1px solid var(--ln);display:grid;place-items:center}
.screen::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55)}
.screen>*{position:relative}
.tag{position:absolute!important;top:14px;left:14px;background:var(--au);color:#000;font-weight:800;font-size:12px;padding:4px 10px;border-radius:6px;letter-spacing:.06em}
.cnt{position:absolute!important;top:14px;right:14px;background:rgba(0,0,0,.7);padding:4px 10px;border-radius:6px;font-size:13px}
.chat{background:var(--sf);border:1px solid var(--ln);border-radius:14px;display:flex;flex-direction:column;height:min(520px,70vh)}
.chat h3{font-size:20px;padding:14px 16px;border-bottom:1px solid var(--ln)}
.msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.msgs b{color:var(--au)}.msgs .sys{color:var(--mu);font-style:italic}
.chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--ln)}
.chat input{flex:1;min-width:0;background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:10px 14px;outline:0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
/* panel */
.panel{padding:32px 0 64px}
.panel h1{font-size:clamp(32px,5vw,48px);margin-bottom:6px}
.sub{color:var(--mu);margin:0 0 24px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:28px}
.step{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.step.done{border-color:var(--ok)}
.step h3{font-size:21px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.step h3 span{font:600 12px var(--sans);color:var(--ok)}
.step input[type=text],.step input[type=tel],.step input[type=file],select{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
.step video,.cam video,.step canvas{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}
.hint{font-size:12px;color:var(--mu);margin:0}
.badge{display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#ffd873,var(--au2));color:#000;font-weight:800;padding:10px 18px;border-radius:999px;margin-bottom:24px}
.badge.on{display:inline-flex}
.studio{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.cam{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.cam video{aspect-ratio:16/9}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:14px;font-weight:600}
.stats b{color:var(--au);font-family:var(--serif);font-size:26px}
.lock{background:var(--sf);border:1px dashed var(--au2);border-radius:14px;padding:22px;color:var(--mu)}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.box{width:100%;max-width:420px;background:var(--sf);border:1px solid var(--au2);border-radius:16px;padding:26px;max-height:90vh;overflow:auto}
.box h2{font-size:30px;margin-bottom:14px}
.box label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.box input,.box select{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:11px 12px}
.stars{display:flex;gap:6px;font-size:34px;margin:12px 0}
.stars button{background:none;border:0;cursor:pointer;color:#444;padding:0}.stars button.on{color:var(--au)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--au);color:#000;font-weight:700;padding:12px 20px;border-radius:999px;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
footer{border-top:1px solid var(--ln);padding:24px 0;color:var(--mu);font-size:13px;text-align:center}
@media(max-width:980px){.cats{grid-template-columns:repeat(2,1fr)}.live-l,.studio{grid-template-columns:1fr}.search{display:none}}
@media(max-width:760px){
 .burger{display:block;margin-left:auto}
 nav{position:fixed;top:calc(65px + env(safe-area-inset-top,0px));left:0;right:0;background:#000;border-bottom:1px solid var(--ln);flex-direction:column;align-items:stretch;padding:10px 20px 18px;display:none}
 nav.on{display:flex}nav button{text-align:left;padding:12px;min-height:44px}nav .reg{margin:6px 0 0;text-align:center}
 .cats{grid-template-columns:1fr}.cat{min-height:280px}.trust{grid-template-columns:1fr}.sel{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

/* transmisión estilo Twitch/Kick */
.tw{display:grid;grid-template-columns:1fr 360px;min-height:calc(100dvh - 65px - env(safe-area-inset-top,0px));background:#000}
.tw-main{display:flex;flex-direction:column;min-width:0;overflow-y:auto}
.tw-video{position:relative;aspect-ratio:16/9;background:#050505;width:100%;max-height:72vh}
.tw-video video{width:100%;height:100%;object-fit:contain;background:#000}
.tw-over{position:absolute;inset:14px 14px auto 14px;display:flex;justify-content:space-between;pointer-events:none}
.tw-over .tag,.tw-over .cnt{position:static!important}
.tw-wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);text-align:center;padding:20px;background:rgba(0,0,0,.6)}
.tw-info{padding:18px 20px;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:12px}
.tw-info h1{font-size:30px}
.tw-chat{border-radius:0;border:0;border-left:1px solid var(--ln);height:auto;max-height:none;min-height:360px}
.msgs .pro{color:var(--au)}
.money{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.money div{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px}
.money b{display:block;font:600 34px var(--serif);color:var(--au)}.money small{color:var(--mu)}
.tbl{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-bottom:22px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--ln)}.tbl th{color:var(--mu);font-weight:600}
.wiz{max-width:760px;margin:0 auto;padding:32px 0 64px}
.dots{display:flex;gap:8px;margin:18px 0 24px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--sf2)}.dots i.on{background:var(--au)}
.wiz label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.wiz input,.wiz select{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:11px 12px}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.face{position:relative;max-width:420px;margin:0 auto;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--ln)}
.face video,.face img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.face::after{content:"";position:absolute;inset:12% 16%;border:3px solid var(--au);border-radius:50%}
.face p{position:absolute;left:0;right:0;bottom:12px;margin:0;text-align:center;font-weight:700;text-shadow:0 1px 6px #000;z-index:2}
.rv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.rv img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#000}
.adm{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sf2)}
.pill.aprobado{color:var(--ok)}.pill.pendiente{color:var(--au)}.pill.rechazado,.pill.bloqueado{color:var(--no)}
@media(max-width:980px){.tw{grid-template-columns:1fr}.tw-chat{border-left:0;border-top:1px solid var(--ln);min-height:420px}.fc,.rv{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap bar">
 <button class="brand" data-go="inicio" aria-label="VERITAS, inicio"><svg viewBox="0 0 30 34"><path d="M15 1 2 5v11c0 8 5 14 13 17 8-3 13-9 13-17V5z" fill="none" stroke="#f5b82e" stroke-width="2"/><path d="M8 10h14l-7 14z" fill="#f5b82e"/></svg>VERITAS</button>
 <div class="search"><input id="q" type="search" placeholder="Buscar profesional o especialidad" aria-label="Buscar profesionales"></div>
 <button class="burger" id="bg" aria-label="Abrir menú">☰</button>
 <nav id="nav">
  <button data-go="inicio">Inicio</button><button data-go="medicina">Medicina</button><button data-go="derecho">Derecho</button><button data-go="ingenieria">Ingeniería</button><button data-go="negocios">Negocios</button>
  <button id="pn" data-go="panel" hidden>Mi panel</button><button id="ad" data-go="admin" hidden>Administración</button><button id="li" data-auth="in">Iniciar sesión</button><button class="reg" id="rg" data-auth="up">Registrarse</button>
 </nav></div></header>
<main id="app"></main>
<footer><div class="wrap">© 2026 VERITAS. Asesoría profesional verificada. Todos los profesionales son verificados.</div></footer>
<div class="modal" id="md"><div class="box" id="bx"></div></div>
<div class="toast" id="ts"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script></body></html>
